name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servio_integration_test
          POSTGRES_USER: servio_test
          POSTGRES_PASSWORD: servio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servio_test -d servio_integration_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://servio_test:servio_test_password@127.0.0.1:5432/servio_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run test:integration

  migration-replay:
    name: Migration replay diagnostic (known MIG-001 blocker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servio_integration_test
          POSTGRES_USER: servio_test
          POSTGRES_PASSWORD: servio_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U servio_test -d servio_integration_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://servio_test:servio_test_password@127.0.0.1:5433/servio_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
