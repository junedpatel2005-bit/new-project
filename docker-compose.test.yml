services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servio_integration_test
      POSTGRES_USER: servio_test
      POSTGRES_PASSWORD: servio_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servio_test -d servio_integration_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
